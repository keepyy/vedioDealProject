<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户信息 · 茶辑</title><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/processing-state.css">
  <style>
    @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
    @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    .paper-card{border-radius:32px 40px 34px 42px;box-shadow:0 24px 60px rgba(75,70,160,.18),inset 0 1px 0 rgba(255,255,255,.9)}
    .doodle{animation:floaty 5s ease-in-out infinite}.star{animation:twinkle 2.4s ease-in-out infinite}
    .art-input{transition:.2s}.art-input:focus{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,211,238,.2)}
    .tea-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#fff7ed,#fce7f3);box-shadow:0 6px 18px rgba(15,118,110,.22);overflow:hidden}.tea-icon img{width:100%;height:100%;object-fit:cover}.text-tea{color:#0f766e}
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-gradient-to-br from-cyan-300 via-sky-300 to-fuchsia-300 text-slate-800">
<div class="pointer-events-none fixed inset-0 overflow-hidden"><div class="doodle absolute -left-16 top-28 h-52 w-52 rounded-full bg-yellow-200/35 blur-sm"></div><div class="doodle absolute -right-12 top-1/3 h-64 w-64 rounded-full bg-pink-200/40 blur-sm" style="animation-delay:-2s"></div><div class="star absolute left-[12%] top-[24%] text-4xl text-white/80">✦</div><div class="star absolute right-[14%] top-[16%] text-3xl text-yellow-100" style="animation-delay:-1s">✿</div><div class="star absolute bottom-[15%] left-[8%] text-3xl text-white/70" style="animation-delay:-.5s">✧</div></div>
<header class="sticky top-0 z-40 border-b border-white/50 bg-white/30 backdrop-blur-xl"><div class="mx-auto flex max-w-6xl items-center gap-3 px-6 py-3"><a href="/" class="tea-icon shrink-0"><img src="/static/logo.png" alt="茶辑"></a><a href="/" class="font-bold text-lg text-tea">茶辑</a><a href="/" data-processing-text="返回中…" class="ml-auto rounded-full border border-white/70 bg-white/45 px-5 py-2 text-sm font-bold text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:bg-white/70">返回首页</a></div></header>
<main class="relative z-10 mx-auto max-w-4xl px-5 py-10">
  <div class="mb-7 text-center"><div class="mx-auto grid h-20 w-20 place-items-center rounded-[28px] border-4 border-white/70 bg-gradient-to-br from-yellow-200 to-pink-200 text-3xl shadow-xl doodle">茶</div><h1 class="mt-4 text-3xl font-black tracking-wide text-slate-800">我的创作小档案</h1><p class="mt-2 text-sm text-slate-600">把账号信息收进一张温柔的艺术卡片里</p><span class="mt-3 inline-block rounded-full bg-white/45 px-4 py-1 text-xs font-bold text-violet-600">用户 ID · {{ current_user.id }}</span></div>
  <div class="grid gap-6 md:grid-cols-2">
    <section class="paper-card relative overflow-hidden border border-white/80 bg-white/80 p-7 backdrop-blur-xl"><div class="absolute -right-5 -top-5 h-24 w-24 rounded-full bg-cyan-200/45"></div><div class="relative"><div class="flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-cyan-100 text-xl">✎</span><div><h2 class="text-xl font-black">个人资料</h2><p class="text-xs text-slate-500">用户名和手机号都可以更新</p></div></div><form id="profileForm" class="mt-6 space-y-4"><label class="block"><span class="text-sm font-bold text-slate-600">用户名</span><input name="username" value="{{ current_user.username }}" required minlength="3" maxlength="24" class="art-input mt-2 w-full rounded-2xl border border-cyan-100 bg-cyan-50/60 px-4 py-3 outline-none focus:border-cyan-400"></label><label class="block"><span class="text-sm font-bold text-slate-600">绑定手机号</span><input id="phone" name="phone" value="{{ current_user.phone or '' }}" maxlength="11" placeholder="尚未绑定" class="art-input mt-2 w-full rounded-2xl border border-violet-100 bg-violet-50/60 px-4 py-3 outline-none focus:border-violet-400"></label><div class="flex gap-2"><input id="code" name="code" maxlength="6" placeholder="变更手机号时填写验证码" class="art-input min-w-0 flex-1 rounded-2xl border border-pink-100 bg-pink-50/60 px-4 py-3 outline-none focus:border-pink-400"><button type="button" id="sendCode" class="rounded-2xl bg-cyan-100 px-4 text-sm font-black text-cyan-700 transition hover:-translate-y-0.5">获取验证码</button></div><p class="rounded-xl bg-amber-50 px-3 py-2 text-xs text-amber-600">开发测试验证码固定为 123456，手机号不变时无需填写。</p><p id="profileMsg" class="hidden text-sm"></p><button class="w-full rounded-2xl bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-500 py-3 font-black text-white shadow-lg transition hover:-translate-y-1 hover:shadow-xl">保存我的资料</button></form></div></section>
    <section class="paper-card relative overflow-hidden border border-white/80 bg-white/80 p-7 backdrop-blur-xl"><div class="absolute -bottom-8 -left-8 h-28 w-28 rounded-full bg-pink-200/40"></div><div class="relative"><div class="flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-pink-100 text-xl">♢</span><div><h2 class="text-xl font-black">登录密码</h2><p class="text-xs text-slate-500">为你的小天地换一把新钥匙</p></div></div><div class="mt-6 rounded-2xl border border-dashed border-violet-200 bg-gradient-to-r from-violet-50 to-pink-50 px-4 py-4 text-center font-mono text-lg tracking-[.45em] text-violet-500">••••••••••••</div><p class="mt-2 text-center text-xs text-slate-500">系统不会显示原密码或密码哈希</p><form id="passwordForm" class="mt-6 space-y-4"><input type="password" name="old_password" required placeholder="当前密码" class="art-input w-full rounded-2xl border border-violet-100 bg-violet-50/60 px-4 py-3 outline-none focus:border-violet-400"><input type="password" name="new_password" required minlength="8" placeholder="新密码（至少8位）" class="art-input w-full rounded-2xl border border-pink-100 bg-pink-50/60 px-4 py-3 outline-none focus:border-pink-400"><p id="passwordMsg" class="hidden text-sm"></p><button type="submit" data-processing-text="更新中…" class="w-full rounded-2xl bg-gradient-to-r from-violet-500 to-pink-500 py-3 font-black text-white shadow-lg transition hover:-translate-y-1 hover:shadow-xl">更新密码钥匙</button></form><div class="mt-7 flex justify-center gap-5 text-2xl text-slate-300"><span>☁</span><span class="text-yellow-300">✦</span><span class="text-pink-300">❀</span></div></div></section>
  </div>
</main>
<script>
function showMessage(node,message,ok){node.textContent=message;node.className=`text-sm rounded-xl px-3 py-2 ${ok?'bg-emerald-50 text-emerald-600':'bg-red-50 text-red-600'}`;}
document.getElementById('sendCode').addEventListener('click',async e=>{const btn=e.currentTarget;if(!ProcessingState.start(btn))return;try{const phone=document.getElementById('phone').value.trim();const r=await fetch('/auth/sms-code',{method:'POST',body:new URLSearchParams({phone})});const d=await r.json();showMessage(document.getElementById('profileMsg'),r.ok?`开发验证码：${d.development_code}`:d.detail,r.ok);}catch(_){showMessage(document.getElementById('profileMsg'),'请求失败，请稍后重试',false);}finally{ProcessingState.stop(btn);}});
document.getElementById('profileForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;if(!ProcessingState.start(btn))return;let ok=false;try{const r=await fetch('/api/account/profile',{method:'POST',body:new FormData(e.target)});const d=await r.json();ok=r.ok;showMessage(document.getElementById('profileMsg'),r.ok?'资料已经漂亮地保存好了':d.detail,r.ok);if(r.ok)setTimeout(()=>location.reload(),500);}catch(_){showMessage(document.getElementById('profileMsg'),'请求失败，请稍后重试',false);}finally{if(!ok)ProcessingState.stop(btn);}});
document.getElementById('passwordForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;if(!ProcessingState.start(btn))return;try{const r=await fetch('/api/account/password',{method:'POST',body:new FormData(e.target)});const d=await r.json();showMessage(document.getElementById('passwordMsg'),r.ok?'新密码已经生效':d.detail,r.ok);if(r.ok)e.target.reset();}catch(_){showMessage(document.getElementById('passwordMsg'),'请求失败，请稍后重试',false);}finally{ProcessingState.stop(btn);}});
</script>
<script src="/static/processing-state.js"></script>
</body></html>
