services:
  gpu-detector:
    build:
      context: .
      dockerfile: docker/gpu.Dockerfile
    container_name: vedio-agent-gpu-detector
    expose:
      - "8100"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - YOLO_MODEL=/models/yolo11n.pt
    volumes:
      - yolo-models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: vedio-agent-app
    expose:
      - "8000"
    # ffmpeg 仍使用 NVIDIA NVENC/NVDEC，业务容器保留 video capability。
    runtime: nvidia
    depends_on:
      gpu-detector:
        condition: service_healthy
    volumes:
      # 持久化存储（上传的视频、生成的片段）
      - ./storage:/app/storage
      # 应用运行配置
      - ./.env:/app/.env:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # 一键关闭 ffmpeg GPU 加速（=1 时强制走 CPU libx264 + 软解）
      - DISABLE_HWACCEL=0
      - SANDBOX_ENABLED=false
      - STORAGE_DIR=/app/storage
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - GPU_DETECTOR_URL=http://gpu-detector:8100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: vedio-agent-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  yolo-models:
